# Deploy from a browser: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: pokejev
    runtime: docker
    plan: starter # the free plan sleeps when idle, which stops Jev playing
    healthCheckPath: /healthz
    envVars:
      - key: JEV_MODEL
        value: jev
      - key: JEV_BATTLE_MODEL
        value: jev
      - key: JEV_VISION
        value: 'true'
      # Paste these in the Render dashboard rather than committing them.
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: JEV_ACCESS_TOKEN
        generateValue: true
    disk:
      name: jev-data
      mountPath: /data
      sizeGB: 1
