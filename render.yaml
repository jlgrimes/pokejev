# Deploy from a browser: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: pokejev
    runtime: docker
    branch: claude/jev-pokemon-red-gameplay-7joq6g
    plan: starter # the free plan sleeps when idle, which stops Jev playing
    healthCheckPath: /healthz
    envVars:
      - key: JEV_MODEL
        value: typesafe-ai/jev
      - key: JEV_BATTLE_MODEL
        value: typesafe-ai/jev
      # Jev decides as an evaluation model: it weighs the legal options and
      # returns a distribution, which is what the viewer draws as bars.
      - key: JEV_MODE
        value: evaluate
      # Only used by JEV_MODE=generate; an evaluation model takes structured
      # state rather than pictures.
      - key: JEV_VISION
        value: 'true'
      - key: JEV_SPEED
        value: '4'
      # Required: nothing outside Vercel can use the OIDC token, so the
      # container needs a real gateway key. Paste it in the dashboard.
      - key: AI_GATEWAY_API_KEY
        sync: false
      # Optional: only for sharing progress with the Vercel deployment. The
      # mounted disk below already survives restarts on its own.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: JEV_ACCESS_TOKEN
        generateValue: true
    disk:
      name: jev-data
      mountPath: /data
      sizeGB: 1
